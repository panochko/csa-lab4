in_source: |2+
  ; Ввод: количество чисел, затем сами числа (как pstr: сначала длина).
  (defun at (a i)
    (+ a (* i 4)))

  (defun insert (a i)
    (let ((x (load (at a i)))
          (j (- i 1)))
      (while (and (>= j 0) (> (load (at a j)) x))
        (store (at a (+ j 1)) (load (at a j)))
        (setq j (- j 1)))
      (store (at a (+ j 1)) x)))

  (setq data (array 64))
  (setq n (read-int))
  (setq i 0)
  (while (< i n)
    (store (at data i) (read-int))
    (setq i (+ i 1)))
  (setq i 1)
  (while (< i n)
    (insert data i)
    (setq i (+ i 1)))
  (setq i 0)
  (while (< i n)
    (print-int (load (at data i)))
    (print-char #\space)
    (setq i (+ i 1)))
